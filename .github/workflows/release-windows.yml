name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test Windows client
        run: dotnet test apps/windows/ShowWhere.Windows.Tests/ShowWhere.Windows.Tests.csproj -c Release

      - name: Publish self-contained executable
        shell: pwsh
        env:
          SHOWWHERE_CLIENT_TOKEN: ${{ secrets.SHOWWHERE_CLIENT_TOKEN }}
        run: >-
          ./scripts/publish-remote-windows.ps1
          -BackendUrl 'https://api-production-6901.up.railway.app/api/guide'
          -OutputDirectory 'artifacts/windows-x64'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/windows-x64/ShowWhere.exe
