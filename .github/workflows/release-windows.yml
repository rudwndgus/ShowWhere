name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test Windows client
        run: dotnet test apps/windows/ShowWhere.Windows.Tests/ShowWhere.Windows.Tests.csproj -c Release

      - name: Publish self-contained executable
        run: >-
          dotnet publish apps/windows/ShowWhere.Desktop/ShowWhere.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/windows-x64

      - name: Give the executable a stable download name
        shell: pwsh
        run: Move-Item -LiteralPath artifacts/windows-x64/ShowWhere.exe -Destination artifacts/ShowWhere-Windows-x64.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/ShowWhere-Windows-x64.exe
