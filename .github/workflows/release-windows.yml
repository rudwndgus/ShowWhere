name: Release Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test Windows client
        run: dotnet test apps/windows/ShowWhere.Windows.Tests/ShowWhere.Windows.Tests.csproj -c Release

      - name: Publish self-contained executable
        shell: pwsh
        env:
          SHOWWHERE_CLIENT_TOKEN: ${{ secrets.SHOWWHERE_CLIENT_TOKEN }}
          SHOWWHERE_BACKEND_URL: ${{ vars.SHOWWHERE_BACKEND_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SHOWWHERE_BACKEND_URL)) {
            throw 'Repository variable SHOWWHERE_BACKEND_URL is required.'
          }
          ./scripts/publish-remote-windows.ps1 `
            -BackendUrl $env:SHOWWHERE_BACKEND_URL `
            -OutputDirectory 'artifacts/windows-x64'

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          overwrite_files: true
          files: artifacts/windows-x64/ShowWhere.exe

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: showwhere-windows-x64
          path: artifacts/windows-x64/ShowWhere.exe
          if-no-files-found: error
